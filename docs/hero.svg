<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#1b1726"/>
    </linearGradient>
    <linearGradient id="effort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43a047"/>
      <stop offset="0.45" stop-color="#fdd835"/>
      <stop offset="0.75" stop-color="#fb8c00"/>
      <stop offset="1" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="profileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="profileMask">
      <rect width="1280" height="640" fill="url(#profileFill)"/>
    </mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d0bcff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d0bcff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .on   { fill: #e6e1e5; }
      .muted{ fill: #cac4d0; }
      .prim { fill: #d0bcff; }
      .onp  { fill: #381e72; }
      .out  { fill: none; stroke: #938f99; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- elevation profile, coloured by effort -->
  <path d="M0 612 C 90 604, 150 580, 230 584 S 360 612, 440 594 S 560 548, 660 556 S 780 596, 860 572 S 980 520, 1080 534 S 1200 574, 1280 552 L1280 640 L0 640 Z"
        fill="url(#effort)" mask="url(#profileMask)"/>
  <path d="M0 612 C 90 604, 150 580, 230 584 S 360 612, 440 594 S 560 548, 660 556 S 780 596, 860 572 S 980 520, 1080 534 S 1200 574, 1280 552"
        fill="none" stroke="url(#effort)" stroke-width="3" stroke-opacity="0.75"/>

  <!-- copy -->
  <text x="80" y="150" font-size="15" font-weight="600" letter-spacing="3.5" class="prim">KAROO EXTENSION</text>
  <text x="76" y="232" font-size="78" font-weight="800" class="on" letter-spacing="-1.5">Ride Rating</text>
  <text x="80" y="284" font-size="30" font-weight="500" class="muted">How hard was that ride?</text>

  <!-- RPE scale, 7 highlighted -->
  <g transform="translate(80 318)">
    <rect x="0" y="0" width="440" height="10" rx="5" fill="url(#effort)" opacity="0.9"/>
    <g font-size="13" font-weight="600" class="muted" text-anchor="middle">
      <text x="22" y="36">1</text><text x="66" y="36">2</text><text x="110" y="36">3</text>
      <text x="154" y="36">4</text><text x="198" y="36">5</text><text x="242" y="36">6</text>
      <text x="330" y="36">8</text><text x="374" y="36">9</text><text x="418" y="36">10</text>
    </g>
    <circle cx="286" cy="5" r="13" fill="#0e1014" stroke="#fff" stroke-width="3"/>
    <text x="286" y="38" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">7</text>
  </g>

  <text x="80" y="410" font-size="20" class="muted">RPE 1–10 and Feel, captured on the bike,</text>
  <text x="80" y="438" font-size="20" class="muted">synced to your <tspan class="on" font-weight="700">intervals.icu</tspan> activity.</text>

  <!-- steps -->
  <g font-size="15" font-weight="600" transform="translate(80 474)">
    <rect x="0" y="0" width="92" height="36" rx="18" fill="#1f1d26" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="46" y="23" text-anchor="middle" class="on">Pause</text>
    <text x="108" y="23" text-anchor="middle" class="muted">→</text>
    <rect x="124" y="0" width="84" height="36" rx="18" fill="#d0bcff"/>
    <text x="166" y="23" text-anchor="middle" class="onp">Rate</text>
    <text x="224" y="23" text-anchor="middle" class="muted">→</text>
    <rect x="240" y="0" width="112" height="36" rx="18" fill="#1f1d26" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="296" y="23" text-anchor="middle" class="on">End ride</text>
    <text x="368" y="23" text-anchor="middle" class="muted">→</text>
    <rect x="384" y="0" width="124" height="36" rx="18" fill="#1f1d26" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="446" y="23" text-anchor="middle" class="on">intervals.icu</text>
  </g>

  <!-- device -->
  <ellipse cx="1005" cy="330" rx="300" ry="300" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect x="833" y="122" width="6" height="70" rx="3" fill="#3a3d45"/>
    <rect x="1171" y="122" width="6" height="70" rx="3" fill="#3a3d45"/>
    <rect x="833" y="470" width="6" height="56" rx="3" fill="#3a3d45"/>
    <rect x="1171" y="470" width="6" height="56" rx="3" fill="#3a3d45"/>
    <rect x="838" y="44" width="334" height="566" rx="46" fill="#202228" stroke="#41444d" stroke-width="2"/>
    <rect x="850" y="56" width="310" height="542" rx="36" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <rect x="865" y="88" width="280" height="460" rx="10" fill="#1c1b1f"/>

  <!-- screen: the actual picker layout -->
  <text x="877" y="122" font-size="20" font-weight="500" class="on">How hard was it?</text>
  <text x="877" y="144" font-size="12" class="muted">RPE 7 · Very hard</text>

  <g font-size="17" text-anchor="middle">
    <rect class="out" x="877.5"  y="156.5" width="45.4" height="40" rx="20"/><text x="900.2"  y="182" class="prim">1</text>
    <rect class="out" x="929.9"  y="156.5" width="45.4" height="40" rx="20"/><text x="952.6"  y="182" class="prim">2</text>
    <rect class="out" x="982.3"  y="156.5" width="45.4" height="40" rx="20"/><text x="1005"   y="182" class="prim">3</text>
    <rect class="out" x="1034.7" y="156.5" width="45.4" height="40" rx="20"/><text x="1057.4" y="182" class="prim">4</text>
    <rect class="out" x="1087.1" y="156.5" width="45.4" height="40" rx="20"/><text x="1109.8" y="182" class="prim">5</text>

    <rect class="out" x="877.5"  y="202.5" width="45.4" height="40" rx="20"/><text x="900.2"  y="228" class="prim">6</text>
    <rect x="929.4" y="202" width="46.4" height="41" rx="20.5" fill="#d0bcff"/><text x="952.6" y="228" class="onp" font-weight="700">7</text>
    <rect class="out" x="982.3"  y="202.5" width="45.4" height="40" rx="20"/><text x="1005"   y="228" class="prim">8</text>
    <rect class="out" x="1034.7" y="202.5" width="45.4" height="40" rx="20"/><text x="1057.4" y="228" class="prim">9</text>
    <rect class="out" x="1087.1" y="202.5" width="45.4" height="40" rx="20"/><text x="1109.8" y="228" class="prim">10</text>
  </g>

  <text x="877" y="276" font-size="18" font-weight="500" class="on">How did you feel?</text>
  <g font-size="13" text-anchor="middle">
    <rect class="out" x="877.5" y="288.5" width="255" height="30" rx="15"/><text x="1005" y="308" class="prim">Strong</text>
    <rect x="877" y="324" width="256" height="31" rx="15.5" fill="#d0bcff"/><text x="1005" y="344" class="onp" font-weight="700">Good</text>
    <rect class="out" x="877.5" y="360.5" width="255" height="30" rx="15"/><text x="1005" y="380" class="prim">Normal</text>
    <rect class="out" x="877.5" y="396.5" width="255" height="30" rx="15"/><text x="1005" y="416" class="prim">Poor</text>
    <rect class="out" x="877.5" y="432.5" width="255" height="30" rx="15"/><text x="1005" y="452" class="prim">Weak</text>
  </g>

  <rect x="877" y="474" width="256" height="38" rx="19" fill="#d0bcff"/>
  <text x="1005" y="499" font-size="16" text-anchor="middle" class="onp" font-weight="500">Done</text>
  <text x="1005" y="532" font-size="9.5" text-anchor="middle" class="muted">Rate before tapping End Ride.</text>
</svg>
